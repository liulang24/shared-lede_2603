name: build immortalwrt WR740N

on:
  workflow_dispatch:
    inputs:
      model:
        description: '选择设备'
        required: true
        type: choice
        options:
          - 'qihoo-c301'
      branch:
        description: '选择版本'
        required: true
        type: choice
        options:
          - 'openwrt-25.12'
          - 'openwrt-24.10'
          - 'openwrt-23.05'
          - 'openwrt-21.02'
          - 'master'
      latest_tag:
        description: '切换到最近稳定版本(master版本无)'
        required: false
        type: boolean
      lan_ipad:
        description: '设置LAN口IP地址(会覆盖modify脚本中的设置)'
        required: false
        default: ''
        type: string
      login_pwd:
        description: '设置初始登陆密码(会覆盖modify脚本中的设置)'
        required: false
        default: ''
        type: string
      record:
        description: '输入版本描述'     
        required: false
        default: '升级内容：内核升级，更新应用版本'
        type: string
      release:
        description: '上传到release'
        required: false
        default: true
        type: boolean
      artifact:
        description: '上传到artifact'
        required: false
        type: boolean

permissions:
  contents: write

jobs:
  to-build:
    name: build
    runs-on: ubuntu-latest
    env:
      EXTRA_STR: _some
    steps:

      - name: Hide sensitive inputs
        if: github.event_name == 'workflow_dispatch'
        uses: hugcabbage/action-hide-sensitive-inputs@v1
        with:
          include_inputs: login_pwd

      - name: Display initial disk space
        run: |
          df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ${{ env.EXTRA_STR }}

      - name: Prepare environments
        env:
          REQUIREMENTS: ${{ env.EXTRA_STR }}/extra-files/requirements-transit.txt
        run: |
          sudo apt-get update
          sudo apt-get -y install gcc-multilib gettext
          sudo apt-get clean
          pip3 install -r $REQUIREMENTS

      - name: Prepare deployment
        id: prepare-deployment
        env:
          MODEL_NAME: ${{ inputs.model }}
          BRANCH_NAME: ${{ inputs.branch }}
          LATEST_TAG: ${{ inputs.latest_tag }}
          LOGIN_IP: ${{ inputs.lan_ipad }}
          LOGIN_PWD: ${{ inputs.login_pwd }}
          TEMP_PREFIX: ${{ env.EXTRA_STR }}
          DEPLOY_DIR: ${{ env.EXTRA_STR }}/preset-immortalwrt
          TRANSIT_PY: ${{ env.EXTRA_STR }}/extra-files/transit.py
        run: |
          chmod +x $TRANSIT_PY
          $TRANSIT_PY

      - name: Clone sources
        env:
          CLONE_SH: ${{ steps.prepare-deployment.outputs.clone_sh }}
        run: |
          chmod +x $CLONE_SH
          $CLONE_SH


# ========== WR740N v5 硬改16M：DTS、设备定义、网口board、LAN/24配置 ==========
cd immortalwrt

# 1、写入DTS文件 target/linux/ath79/dts/ar9331_tplink_tl-wr740n-v5_16m.dts
cat > target/linux/ath79/dts/ar9331_tplink_tl-wr740n-v5_16m.dts <<'EOF'
// SPDX-License-Identifier: GPL-2.0-or-later OR MIT
#include "ar9331.dtsi"

/ {
	model = "TP-Link TL-WR740N v5 (16M Flash Modified)";
	compatible = "tplink,tl-wr740n-v5", "qca,ar9331";

	aliases {
		led-boot = &led_system;
		led-failsafe = &led_system;
		led-running = &led_system;
		led-upgrade = &led_system;
	};

	leds {
		compatible = "gpio-leds";
		led_system: system {
			label = "tp-link:green:system";
			gpios = <&gpio 27 GPIO_ACTIVE_LOW>;
		};
		wlan {
			label = "tp-link:green:wlan";
			gpios = <&gpio 13 GPIO_ACTIVE_LOW>;
		};
	};
};

&spi {
	status = "okay";
	flash@0 {
		compatible = "jedec,spi-nor";
		reg = <0>;
		spi-max-frequency = <25000000>;

		partitions {
			compatible = "fixed-partitions";
			#address-cells = <1>;
			#size-cells = <1>;

			partition@0 {
				label = "u-boot";
				reg = <0x000000 0x020000>;
				read-only;
			};
			partition@20000 {
				label = "firmware";
				reg = <0x020000 0xee0000>;
			};
			partition@f00000 {
				label = "config";
				reg = <0xf00000 0x010000>;
				read-only;
			};
			partition@f10000 {
				label = "factory";
				reg = <0xf10000 0x0f0000>;
				read-only;
			};
		};
	};
};

&eth0 {
	status = "okay";
	phy-handle = <&phy4>;
	phy-mode = "mii";
};

&eth1 {
	status = "okay";
};

&switch {
	status = "okay";
};

&wmac {
	status = "okay";
	qca,ath9k-eeprom-partition = <&factory>;
};
EOF

# 2、tplink.mk 添加v5 16M设备定义，IMAGE_SIZE=14M
cat >> target/linux/ath79/image/tplink.mk <<'EOF'
define Device/tplink_tl-wr740n-v5-16m
  $(Device/tplink)
  SOC := ar9331
  DEVICE_VENDOR := TP-Link
  DEVICE_MODEL := TL-WR740N
  DEVICE_VARIANT := v5 16M(hardmod)
  DEVICE_DTS := ar9331_tplink_tl-wr740n-v5_16m
  IMAGE_SIZE := 14336k
  TPLINK_HWID := 0x07400005
  TPLINK_HWREV := 0x1
endef
TARGET_DEVICES += tplink_tl-wr740n-v5-16m
EOF

#3、02_network 网口、LED board识别，添加tl-wr740n-v5
sed -i '/"tplink,tl-wr741nd-v4")/i \
	"tplink,tl-wr740n-v5") \
		ucidef_set_interfaces_lan_wan "eth1" "eth0" \
		ucidef_add_switch "switch0" \
			"0@eth1" "1:lan" "2:lan" "3:lan" "4:lan" \
		ucidef_set_led_netdev "wan" "WAN" "tp-link:green:wan" "eth0" \
		;;' target/linux/ath79/base-files/etc/board.d/02_network

# ========== uci-defaults：LAN 192.168.1.1/24 + DHCP 100~200 ==========
mkdir -p files/etc/uci-defaults
cat > files/etc/uci-defaults/99-set-lan-24 <<'EOF'
#!/bin/sh
# LAN IP /24
uci set network.lan.ipaddr='192.168.1.1/24'
# DHCP 范围：192.168.1.100 ~ 192.168.1.200
uci set dhcp.lan.start='100'
uci set dhcp.lan.limit='101'
uci commit network
uci commit dhcp
exit 0
EOF
chmod +x files/etc/uci-defaults/99-set-lan-24






      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Modify configuration
        env:
          MODIFY_SH: ${{ steps.prepare-deployment.outputs.modify_sh }}
        run: |
          chmod +x $MODIFY_SH
          $MODIFY_SH

      - name: Generate .config
        env:
          DOT_CONFIG: ${{ steps.prepare-deployment.outputs.dot_config }}
        run: |
          mv $DOT_CONFIG .config
          make defconfig

      - name: Make download
        run: |
          make download -j8 || make download -j1 V=s

      - name: Compile
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Pick up files
        run: |
          mkdir -p _collected_firmware/packages
          # 删除 targets 下的 packages 目录（仅当存在时）
          find bin/targets/ -type d -name 'packages' -exec rm -rf {} + 2>/dev/null || true
          # 复制 targets 下的文件
          find bin/targets/ -type f -exec cp {} _collected_firmware/ \;
          # 复制 ipk（先确认存在）
          find bin/packages/ -type f -name '*.ipk' -exec cp {} _collected_firmware/packages/ \; 2>/dev/null || true
          cd _collected_firmware
          zip -r -s 2000m allfiles.zip * || true
          cd packages
          zip -r ../packages.zip * || true

      - name: Generate summary
        continue-on-error: true
        id: generate-summary
        env:
          FOR_DEVICE: ${{ steps.prepare-deployment.outputs.fordevice }}
          CODE_DIR: ${{ steps.prepare-deployment.outputs.codedir }}
          TRANSIT_PY: ${{ env.EXTRA_STR }}/extra-files/transit.py
        run: |
          chmod +x $TRANSIT_PY
          $TRANSIT_PY

      - name: Calculate tag version
        id: calculate-version
        if: inputs.release
        uses: hugcabbage/next-version@v1
        with:
          repo_path: ${{ env.EXTRA_STR }}

      - name: Upload firmware to release
        id: to-release
        if: steps.calculate-version.conclusion == 'success' && inputs.release
        continue-on-error: true
        uses: svenstaro/upload-release-action@v2
        with:
          file: _collected_firmware/*
          tag: ${{ steps.calculate-version.outputs.version }}
          release_name: ${{ steps.calculate-version.outputs.version }} ${{ steps.generate-summary.outputs.stitle }}
          overwrite: true
          prerelease: false
          body: |
            ${{ inputs.record }}
            ${{ steps.generate-summary.outputs.summary }}
          file_glob: true

      - name: Upload firmware to artifact
        if: inputs.artifact || steps.to-release.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: collected_firmware
          path: |
            _collected_firmware/
            !_collected_firmware/*.zip

      - name: Display finishing disk space
        run: |
          df -h
          echo "----------------------------"
          du -h --max-depth=1
